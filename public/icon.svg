<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  
  <!-- Back Card -->
  <rect x="110" y="80" width="280" height="340" rx="24" fill="#6366f1" opacity="0.5" transform="rotate(-8 250 250)"/>
  
  <!-- Middle Card -->
  <rect x="116" y="86" width="280" height="340" rx="24" fill="#818cf8" opacity="0.75" transform="rotate(6 256 256)"/>
  
  <!-- Front Card -->
  <rect x="116" y="96" width="280" height="320" rx="24" fill="url(#card-grad)" filter="drop-shadow(0 16px 24px rgba(0,0,0,0.25))"/>
  
  <!-- Card Content: A / 文 -->
  <text x="180" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" fill="#4f46e5" text-anchor="middle">A</text>
  <text x="330" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="900" fill="#059669" text-anchor="middle">あ</text>
  
  <!-- Mini SRS status pill -->
  <rect x="166" y="310" width="180" height="40" rx="20" fill="#e0e7ff"/>
  <circle cx="196" cy="330" r="8" fill="#4f46e5"/>
  <circle cx="236" cy="330" r="8" fill="#4f46e5"/>
  <circle cx="276" cy="330" r="8" fill="#4f46e5"/>
  <circle cx="316" cy="330" r="8" fill="#10b981"/>
</svg>
